<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Hina Niside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a; --paper:#ffffff; --line:#dcdcdc; --muted:#9a9a9a; --note:#b9761f;
    --ph:repeating-linear-gradient(135deg,#e9e9e9,#e9e9e9 10px,#f4f4f4 10px,#f4f4f4 20px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; font-weight:300; line-height:1.8;}
  .serif{font-family:'Zen Old Mincho', serif; font-weight:500;}
  a{color:inherit;}
  .note{display:inline-block; font-size:12px; color:var(--note); border:1px dashed var(--note);
        padding:3px 10px; margin:18px 32px 0; background:#fffaf2;}
  .pagetag{position:fixed; bottom:16px; right:16px; font-size:11px; color:var(--muted);
        border:1px solid var(--line); padding:3px 9px; background:rgba(255,255,255,.9); z-index:30;}

  header{position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center;
        justify-content:space-between; padding:22px 32px; mix-blend-mode:difference; color:#fff;}
  header .logo{font-size:15px; letter-spacing:.08em; text-decoration:none;}
  header nav{display:flex; gap:28px; font-size:13px;}
  header nav a{text-decoration:none; opacity:.7;}
  header nav a.active{opacity:1; border-bottom:1px solid currentColor;}
  header nav a:hover{opacity:1;}

  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}

  footer{padding:40px 32px; text-align:center; font-size:11px; color:var(--muted); border-top:1px solid var(--line);}

  @media (max-width:760px){ header nav{gap:16px; font-size:11px;} }

  #contact .wrap{padding-top:140px; padding-bottom:120px; max-width:720px;}
  #contact h2{font-size:22px; margin-bottom:16px;}
  #contact .intro{font-size:14px; color:var(--muted); margin-bottom:48px; max-width:46em;}
  form{display:flex; flex-direction:column; gap:26px;}
  .field{display:flex; flex-direction:column; gap:8px;}
  .field label{font-size:13px; color:#444;}
  .field label .req{color:var(--note); margin-left:4px;}
  .field input, .field textarea{
    border:none; border-bottom:1px solid var(--line); background:transparent;
    font-family:inherit; font-size:14px; padding:8px 2px; color:var(--ink);
    outline:none;
  }
  .field input:focus, .field textarea:focus{border-bottom-color:var(--ink);}
  .field textarea{resize:vertical; min-height:96px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  .file-btn{border:1px solid var(--line); padding:10px 16px; font-size:13px; color:var(--muted);
      width:fit-content; cursor:pointer;}
  .foot-notes{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.9;}
  .submit-btn{margin-top:12px; border:1px solid var(--ink); background:none; color:var(--ink);
      font-family:inherit; font-size:13px; letter-spacing:.05em; padding:14px 32px;
      width:fit-content; cursor:pointer;}
  @media (max-width:760px){ .row2{grid-template-columns:1fr;} }

</style>
</head>
<body>
<span class="pagetag">CONTACT</span>
<header>
  <a class="logo serif" href="index.html">HINA NISIDE</a>
  <nav>
    <a href="index.html" class="">Home</a>
    <a href="works.html" class="">Works</a>
    <a href="text.html" class="">Text</a>
    <a href="about.html" class="">About</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<!-- <div class="note">05 · CONTACT — Rebuilt as an inquiry form, referencing hideakihamada.com/contact. Fields adapted from a shoot-commission form to a music-commission one.</div> -->
<section id="contact"><div class="wrap">
  <h2 class="serif">Contact</h2>
  <!-- <p class="intro">For commissions, performances, and licensing inquiries, please fill out the form below. Replies typically take 3 days to a week.</p> -->

  <form>
    <div class="field">
      <label>Name <span class="req">*</span></label>
      <input type="text">
    </div>
    <div class="field">
      <label>Organization</label>
      <input type="text">
    </div>
    <div class="row2">
      <div class="field">
        <label>Phone <span class="req">*</span></label>
        <input type="tel">
      </div>
      <div class="field">
        <label>Website</label>
        <input type="url">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Email <span class="req">*</span></label>
        <input type="email">
      </div>
      <div class="field">
        <label>Email (confirm) <span class="req">*</span></label>
        <input type="email">
      </div>
    </div>
    <div class="field">
      <label>Project name</label>
      <input type="text">
    </div>
    <div class="row2">
      <div class="field">
        <label>Date needed by <span class="req">*</span></label>
        <input type="text" placeholder="e.g. recording / performance date">
      </div>
      <div class="field">
        <label>Delivery deadline <span class="req">*</span></label>
        <input type="text">
      </div>
    </div>
    <div class="field">
      <label>Budget <span class="req">*</span></label>
      <input type="text">
    </div>
    <div class="field">
      <label>Project details <span class="req">*</span></label>
      <textarea></textarea>
    </div>
    <div class="field">
      <label>Attachment</label>
      <div class="file-btn">Choose file (up to 100MB)</div>
    </div>

    <div class="foot-notes">
      — Any additional costs (studio time, travel, etc.) will be quoted separately.<br>
      — This form will be protected by reCAPTCHA; Google's Privacy Policy and Terms of Service apply.
    </div>

    <button type="button" class="submit-btn">Send</button>
  </form>
</div></section>

<footer>© 2026 Hina Niside</footer>
</body>
</html>
