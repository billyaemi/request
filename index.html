<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — Hina Niside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a; --paper:#ffffff; --line:#dcdcdc; --muted:#9a9a9a; --note:#b9761f;
    --ph:repeating-linear-gradient(135deg,#e9e9e9,#e9e9e9 10px,#f4f4f4 10px,#f4f4f4 20px);
  }
  * {
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  body {
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:300;
    line-height:1.8;
  }

  .serif {
    font-family:'Zen Old Mincho', serif;
    font-weight:500;
  }

  a {
    /* color:inherit; */
    color: #fff;
  }
  
  .note {
    display:inline-block;
    font-size:12px;
    color:var(--note);
    border:1px dashed var(--note);
    padding:3px 10px;
    margin:18px 32px 0;
    background:#fffaf2;
  }

  .pagetag {
    position:fixed;
    bottom:16px;
    right:16px;
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    padding:3px 9px;
    background:rgba(255,255,255,.9);
    z-index:30;
  }

  header {
    position:fixed;
    top:0; left:0; right:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 32px;
    /* mix-blend-mode:difference; */
    color:#fff;
  }
  header .logo{font-size:15px; letter-spacing:.08em; text-decoration:none;}
  header nav{display:flex; gap:28px; font-size:13px;}
  header nav a{text-decoration:none; opacity:.7;}
  header nav a.active{opacity:1; border-bottom:1px solid currentColor;}
  header nav a:hover{opacity:1;}

  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}

  footer {
    padding:40px 32px;
    text-align:center;
    font-size:11px;
    color:var(--muted);
    border-top:1px solid var(--line);
  }

  @media (max-width:760px){ header nav{gap:16px; font-size:11px;} }

  /* HERO SLIDESHOW : full-screen, auto-transitioning */
  #hero {
    position:relative;
    height:100vh;
    min-height:640px;
    overflow:hidden;
    background:#595959;
  }

  #hero .slide {
    position:absolute;
    inset:0;
    /* 빗금무늬 */
    /* background:var(--ph); */
    /* background-image: url(...) */
    background-color: #c0c0c0;
    opacity:0;
    transition:opacity 1.4s ease;
  }

  #hero .slide.on {
    opacity:1;
  }

  #hero .slide:nth-child(2) {
    filter:brightness(.9) hue-rotate(8deg);
  }
  
  #hero .slide:nth-child(3) { 
    filter:brightness(.96) hue-rotate(-6deg);
  }

  #hero .slide:nth-child(4) {
    filter:brightness(.93);
  }

  #hero .overlay {
    position:absolute;
    left:32px;
    right:32px;
    bottom:36px;
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    color:#fff;
  }

  #hero .overlay .cap {
    font-size:13px;
    letter-spacing:.03em;
    text-shadow:0 1px 8px rgba(88, 88, 88, 0.5);
  }

  #hero .dots {
    display:flex; gap:8px;
  }

  #hero .dots span{ 
    width:5px;
    height:5px;
    border-radius:50%;
    background:rgba(255,255,255,.4);
    transition:background .3s
  }

  #hero .dots span.on {
    background:#fff;
  }
  #hero .phlabel {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:1;
    font-size:12px;
    color:rgba(255, 255, 255, 0.947);
    letter-spacing:.1em;
  }

  #archive {
    padding:88px 0 96px;
  }
  #archive h2 {
    font-size:15px;
    color:var(--muted);
    font-weight:400;
    margin-bottom:28px;
    letter-spacing:.02em;
  }

  .g { 
    display: grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
  }

  .g .cell {
    aspect-ratio:16/10;
    background:var(--ph);
    position:relative;
    overflow:hidden;
  }

  .g .cell .cap {
    position:absolute;
    left:0; right:0; bottom:0; padding:16px;
    background:linear-gradient(transparent, rgba(70, 70, 70, 0.6));
    color:#fff;
    opacity:0;
    transition:opacity .3s; 
    font-size:13px;
  }

  .g .cell:hover .cap {
    opacity:1;
  }

  @media (max-width:760px){ .g{grid-template-columns:1fr;} }

</style>
</head>
<body>
<span class="pagetag">HOME</span>
<header>
  <a class="logo serif" href="index.html">HINA NISIDE</a>
  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="works.html" class="">Works</a>
    <a href="text.html" class="">Text</a>
    <a href="about.html" class="">About</a>
    <a href="contact.html" class="">Contact</a>
  </nav>
</header>

<!-- <div class="note">01 · HOME — Full-screen visual auto-transitions every few seconds, like Hamada's site. Each frame will hold a track's video/image; scrolling down leads into the archive.</div> -->

<section id="hero">
  <div class="slide on"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="phlabel">[ FULL SCREEN VIDEO / PHOTO ]</div>
  <div class="overlay">
    <div class="cap" id="heroCap">Track Title, 2026</div>
    <div class="dots">
      <span class="on"></span><span></span><span></span><span></span>
    </div>
  </div>
</section>

<section id="archive">
  <div class="wrap">
    <h2>Recent Works</h2>
    <div class="g">
      <div class="cell"><div class="cap">Track Title, 2026</div></div>
      <div class="cell"><div class="cap">Track Title, 2025</div></div>
      <div class="cell"><div class="cap">Track Title, 2025</div></div>
      <div class="cell"><div class="cap">Track Title, 2024</div></div>
      <div class="cell"><div class="cap">Track Title, 2024</div></div>
      <div class="cell"><div class="cap">Track Title, 2023</div></div>
    </div>
  </div>
</section>

<footer>© 2026 Hina Niside</footer>

<script>
  const slides = document.querySelectorAll('#hero .slide');
  const dots = document.querySelectorAll('#hero .dots span');
  const titles = ['Track Title, 2026','Track Title, 2025','Track Title, 2025','Track Title, 2024'];
  const capEl = document.getElementById('heroCap');
  let i = 0;
  setInterval(() => {
    slides[i].classList.remove('on');
    dots[i].classList.remove('on');
    i = (i + 1) % slides.length;
    slides[i].classList.add('on');
    dots[i].classList.add('on');
    capEl.textContent = titles[i];
  }, 3800);
</script>
</body>
</html>
