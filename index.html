<!DOCTYPE html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-ja="Hina Niside — 作曲家" data-en="Hina Niside — Composer">Hina Niside — 作曲家</title>
<meta name="description" content="作曲家 Hina Niside（西出 妃那）のオフィシャルサイト。劇伴音楽・ポップス・クラシックを手がける。">
<link rel="icon" href="img/favicon_3.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  /* decide the language before first paint: ?lang=en > saved choice > Japanese */
  (function(){var l='ja',m=location.search.match(/[?&]lang=(ja|en)/);
  try{if(m){l=m[1];}else{var s=localStorage.getItem('lang');if(s==='en'||s==='ja'){l=s;}}}catch(e){if(m){l=m[1];}}
  document.documentElement.setAttribute('data-lang',l);document.documentElement.lang=l;})();
</script>
</head>
<body class="home">

<header>
  <a class="logo serif" href="index.html">HINA NISIDE</a>
  <div class="hd-right">
    <nav aria-label="Main">
      <a href="index.html" aria-current="page">Home</a>
      <a href="works.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-set-lang="ja" aria-pressed="true">JA</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main>
  <section id="hero" aria-label="Featured">
    <h1 class="sr-only">Hina Niside — <span class="t-ja">作曲家</span><span class="t-en">Composer</span></h1>

    <!-- Full-screen images. object-position picks which part of the image stays in frame. -->
    <div class="slide on">
      <img class="cover" src="img/works/fafner.jpg" style="object-position:50% 78%"
           data-alt-ja="蒼穹のファフナー Symphony Orchestra Concert 2026 キービジュアル"
           data-alt-en="Key visual: Fafner in the Azure Symphony Orchestra Concert 2026"
           alt="蒼穹のファフナー Symphony Orchestra Concert 2026 キービジュアル">
      <p class="cap">蒼穹のファフナー Symphony Orchestra Concert, 2026</p>
    </div>
    <div class="slide">
      <img class="cover" src="img/works/defonima.jpg" style="object-position:50% 14%"
           data-alt-ja="デフォニマ キービジュアル" data-alt-en="Defonima key visual"
           alt="デフォニマ キービジュアル">
      <p class="cap">Defonima / デフォニマ</p>
    </div>

    <div class="dots">
      <button type="button" aria-label="Slide 1" aria-current="true"></button>
      <button type="button" aria-label="Slide 2" aria-current="false"></button>
    </div>
  </section>

  <section id="recent">
    <div class="wrap">
      <div class="head">
        <h2 class="serif"><span class="t-ja">最近の作品</span><span class="t-en">Recent Works</span></h2>
        <a class="more" href="works.html"><span class="t-ja">すべて見る</span><span class="t-en">View all</span></a>
      </div>
      <div class="g">
        <button class="cell poster" type="button" data-img="img/works/fafner.jpg">
          <img src="img/works/fafner.jpg" loading="lazy"
               data-alt-ja="蒼穹のファフナー Symphony Orchestra Concert 2026" data-alt-en="Fafner in the Azure Symphony Orchestra Concert 2026" alt="蒼穹のファフナー Symphony Orchestra Concert 2026">
          <span class="cap">蒼穹のファフナー Symphony Orchestra Concert 2026</span>
        </button>
        <button class="cell poster" type="button" data-img="img/works/defonima.jpg">
          <img src="img/works/defonima.jpg" loading="lazy"
               data-alt-ja="デフォニマ" data-alt-en="Defonima" alt="デフォニマ">
          <span class="cap">Defonima / デフォニマ</span>
        </button>
        <button class="cell yt" type="button" data-yt="ErIuyZueXoM" data-start="1800">
          <img src="https://i.ytimg.com/vi/ErIuyZueXoM/hqdefault.jpg" loading="lazy" alt="">
          <span class="cap"><span class="t-ja">クラシック作品 01</span><span class="t-en">Classical work 01</span></span>
        </button>
      </div>
    </div>
  </section>
</main>

<footer>© 2026 Hina Niside</footer>

<script src="js/main.js"></script>
</body>
</html>
