<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works — Hina Niside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a; --paper:#ffffff; --line:#dcdcdc; --muted:#9a9a9a; --note:#b9761f;
    --ph:repeating-linear-gradient(135deg,#e9e9e9,#e9e9e9 10px,#f4f4f4 10px,#f4f4f4 20px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; font-weight:300; line-height:1.8;}
  .serif{font-family:'Zen Old Mincho', serif; font-weight:500;}
  a{color:inherit;}
  .note{display:inline-block; font-size:12px; color:var(--note); border:1px dashed var(--note);
        padding:3px 10px; margin:18px 32px 0; background:#fffaf2;}
  .pagetag{position:fixed; bottom:16px; right:16px; font-size:11px; color:var(--muted);
        border:1px solid var(--line); padding:3px 9px; background:rgba(255,255,255,.9); z-index:30;}

  header{position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center;
        justify-content:space-between; padding:22px 32px; mix-blend-mode:difference; color:#fff;}
  header .logo{font-size:15px; letter-spacing:.08em; text-decoration:none;}
  header nav{display:flex; gap:28px; font-size:13px;}
  header nav a{text-decoration:none; opacity:.7;}
  header nav a.active{opacity:1; border-bottom:1px solid currentColor;}
  header nav a:hover{opacity:1;}

  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}

  footer{padding:40px 32px; text-align:center; font-size:11px; color:var(--muted); border-top:1px solid var(--line);}

  @media (max-width:760px){ header nav{gap:16px; font-size:11px;} }

  #grid{padding-top:96px;}
  .g{display:grid; grid-template-columns:repeat(3,1fr); gap:2px;}
  .g .cell{aspect-ratio:16/10; background:var(--ph); position:relative; overflow:hidden;}
  .g .cell .cap{position:absolute; left:0; right:0; bottom:0; padding:16px;
      background:linear-gradient(transparent, rgba(0,0,0,.6)); color:#fff;
      opacity:0; transition:opacity .3s; font-size:13px;}
  .g .cell:hover .cap{opacity:1;}
  @media (max-width:760px){ .g{grid-template-columns:1fr;} }

  #archive-head{padding:120px 0 24px;}
  #archive-head h2{font-size:22px;}

</style>
</head>
<body>
<span class="pagetag">WORKS</span>
<header>
  <a class="logo serif" href="index.html">HINA NISIDE</a>
  <nav>
    <a href="index.html" class="">Home</a>
    <a href="works.html" class="active">Works</a>
    <a href="text.html" class="">Text</a>
    <a href="about.html" class="">About</a>
    <a href="contact.html" class="">Contact</a>
  </nav>
</header>

<!-- <div class="note">02 · WORKS — Full archive using the same grid grammar as Home. Year/category filters to be considered later.</div> -->
<div class="wrap" id="archive-head"><h2 class="serif">Works</h2></div>
<section id="grid">
  <div class="g">
    <div class="cell"><div class="cap">Track Title, 2026</div></div>
    <div class="cell"><div class="cap">Track Title, 2025</div></div>
    <div class="cell"><div class="cap">Track Title, 2025</div></div>
    <div class="cell"><div class="cap">Track Title, 2024</div></div>
    <div class="cell"><div class="cap">Track Title, 2024</div></div>
    <div class="cell"><div class="cap">Track Title, 2023</div></div>
    <div class="cell"><div class="cap">Track Title, 2023</div></div>
    <div class="cell"><div class="cap">Track Title, 2022</div></div>
    <div class="cell"><div class="cap">Track Title, 2021</div></div>
  </div>
</section>

<footer>© 2026 Hina Niside</footer>
</body>
</html>
